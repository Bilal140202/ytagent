[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "ytagent"
version = "0.1.0"
description = "An agentic YouTube downloader for cloud-based AI agents. Multi-method fallback chain. No cookies, no browser, no LLM at runtime."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [
    { name = "Bilal140202", email = "bilal140202@users.noreply.github.com" },
]
keywords = ["youtube", "downloader", "yt-dlp", "agent", "cli", "cloud", "headless"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Operating System :: POSIX :: Linux",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Internet :: WWW/HTTP",
    "Topic :: Multimedia :: Video",
    "Topic :: Software Development :: Libraries :: Python Modules",
]
dependencies = [
    "yt-dlp>=2026.07.04",
    "requests>=2.32",
    "python-magic>=0.4.27",
    "click>=8.1",
    "rich>=13.7",
]

[project.optional-dependencies]
pot = ["bgutil-ytdlp-pot-provider>=1.3.0"]
dev = [
    "pytest>=8.0",
    "pytest-cov>=5.0",
    "pytest-mock>=3.12",
    "responses>=0.25",
    "ruff>=0.5",
    "mypy>=1.10",
    "types-requests",
]

[project.scripts]
ytagent = "ytagent.cli:main"

[project.urls]
Homepage = "https://github.com/Bilal140202/ytagent"
Repository = "https://github.com/Bilal140202/ytagent"
Issues = "https://github.com/Bilal140202/ytagent/issues"

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W", "UP", "B", "C4", "SIM"]
ignore = ["E501"]  # line length handled by formatter

[tool.ruff.format]
quote-style = "double"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra --strict-markers"
markers = [
    "e2e: marks end-to-end tests that hit real YouTube (deselect with '-m \"not e2e\"')",
]

[tool.mypy]
python_version = "3.11"
strict = false
ignore_missing_imports = true
